<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NATION Team</title>
  <desc id="desc">A bold white N on a dark rounded tile, the NATION Team mark.</desc>
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224" /></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#111111" />
    <text x="512" y="560" text-anchor="middle" dominant-baseline="central"
          font-family="system-ui,-apple-system,sans-serif" font-weight="800"
          font-size="620" fill="#ffffff" letter-spacing="-0.02em">N</text>
  </g>
</svg>
