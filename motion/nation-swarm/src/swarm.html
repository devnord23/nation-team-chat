<script>
"use strict";
/* ============================================================================
   NATION Swarm, one 16-second loop at 120 BPM.

   Everything on screen is a pure function of time: seek(t) draws frame t.
   No timers, no transitions, no state carried between frames. Motion is
   built from closed-form spring step responses; each animated value is a
   sum of those steps, and each sum returns to its starting value within the
   loop. Steps that start near the end keep ringing into the start (they are
   evaluated modulo the loop), so the last frame flows into the first with
   the same position and velocity, for the object, the cursor and the camera.
   ========================================================================== */

// ---------------------------------------------------------------- beat grid
// Replaced by the build step with the grid measured from the track (tools/analyze_beats.py).
const GRID = /*GRID*/{ period: 0.5, offset: 0.001, beats: 32 }/*END*/;
const LOOP = GRID.period * GRID.beats;
const B = k => GRID.offset + (k - 1) * GRID.period; // beat k, 1-based

// ---------------------------------------------------------------- palette
const INK = "#020C01", GREEN = "#CDFFA6", WHITE = "#FFFFFF", CANVAS = "#F2F0EB";

// ---------------------------------------------------------------- math
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const mod = (x, m) => ((x % m) + m) % m;
const smooth = u => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * u * (u * (6 * u - 15) + 10)); // minimum-jerk
const bump = u => (u <= 0 || u >= 1 ? 0 : Math.sin(Math.PI * u) ** 2);

/** Spring step response, 0 -> 1. r is the response (undamped period, s), z the damping ratio. */
function spring(x, r, z) {
  if (x <= 0) return 0;
  const w = TAU / r;
  if (z >= 1) { const e = Math.exp(-w * x); return 1 - e * (1 + w * x); }
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x));
}
/** A spring released at x0 with velocity v0, heading for target; x is time since release. */
function springFrom(x, x0, v0, target, r, z) {
  const w = TAU / r, wd = w * Math.sqrt(1 - z * z), a = x0 - target, b = (v0 + z * w * a) / wd;
  return target + Math.exp(-z * w * x) * (a * Math.cos(wd * x) + b * Math.sin(wd * x));
}

// Spring presets. Tiny overshoot only.
const SP = {
  snap: [0.26, 0.86],   // presses, small UI
  ui: [0.36, 0.84],     // most UI changes
  lead: [0.34, 0.8],    // leading edges
  trail: [0.46, 0.9],   // trailing edges
  soft: [0.5, 0.9],     // larger bodies
  cam: [0.95, 0.94],    // camera
  fade: [0.3, 1.0],     // opacity, no overshoot
};

/**
 * A value made of spring steps. v0 is its value at the loop's start (with
 * every step of the previous cycle settled); the steps must bring it back to
 * v0, which close() checks.
 */
class Track {
  constructor(v0) { this.v0 = v0; this.v = v0; this.steps = []; }
  to(t, v, p = SP.ui, delay = 0) {
    if (v !== this.v) {
      const [r, z] = p;
      this.steps.push({ t: mod(t + delay, LOOP), d: v - this.v, f: x => spring(x, r, z) });
      this.v = v;
    }
    return this;
  }
  ease(t, v, dur) {
    if (v !== this.v) {
      this.steps.push({ t: mod(t, LOOP), d: v - this.v, f: x => smooth(x / dur) });
      this.v = v;
    }
    return this;
  }
  at(tau) {
    let y = this.v0;
    for (const s of this.steps) {
      let e = tau - s.t;
      if (e < 0) { e += LOOP; y -= s.d; } // this step fired last cycle: it has not re-fired yet
      y += s.d * s.f(e);
    }
    return y;
  }
}
const tracks = [];
function T(v0, name) { const t = new Track(v0); t.name = name; tracks.push(t); return t; }
function checkTracks() {
  for (const t of tracks) if (Math.abs(t.v - t.v0) > 1e-6) throw new Error(`track ${t.name} ends at ${t.v}, starts at ${t.v0}`);
}

/** A rectangle whose four edges and radius move on independent springs. */
class Box {
  constructor(name, l, t, r, b, rad) {
    this.name = name;
    this.L = T(l, name + ".l"); this.Tp = T(t, name + ".t"); this.R = T(r, name + ".r"); this.Bt = T(b, name + ".b"); this.rad = T(rad, name + ".rad");
  }
  /** Move to a rect. lead names the edges that lead ("l","r","t","b"); the others trail. */
  to(t, [l, tp, r, b, rad], lead = "", pl = SP.lead, pt = SP.trail, lag = 0.035) {
    const e = (k, track, v) => track.to(t, v, lead.includes(k) ? pl : pt, lead.includes(k) || !lead ? 0 : lag);
    e("l", this.L, l); e("t", this.Tp, tp); e("r", this.R, r); e("b", this.Bt, b);
    if (rad !== undefined) this.rad.to(t, rad, SP.soft);
    return this;
  }
  at(tau) {
    const l = this.L.at(tau), t = this.Tp.at(tau), r = this.R.at(tau), b = this.Bt.at(tau);
    return { l, t, r, b, w: r - l, h: b - t, cx: (l + r) / 2, cy: (t + b) / 2, rad: this.rad.at(tau) };
  }
}
const centered = (cx, cy, w, h, rad) => [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2, rad];

// ---------------------------------------------------------------- svg helpers
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function set(n, attrs) { for (const k in attrs) n.setAttribute(k, typeof attrs[k] === "number" ? +attrs[k].toFixed(3) : attrs[k]); }
function rr(n, x, y, w, h, rad) {
  w = Math.max(0, w); h = Math.max(0, h);
  set(n, { x, y, width: w, height: h, rx: Math.max(0, Math.min(rad, w / 2, h / 2)) });
}
const world = document.getElementById("world");
const overlay = document.getElementById("overlay");
const defs = document.getElementById("defs");

let blurId = 0;
/** Text with its own directional blur filter, for enter/exit. */
function label(parent, str, attrs) {
  const id = "b" + blurId++;
  const f = el("filter", { id, x: "-20%", y: "-60%", width: "140%", height: "220%" }, defs);
  const g = el("feGaussianBlur", { stdDeviation: "0 0" }, f);
  const n = el("text", attrs, parent);
  n.textContent = str;
  n._blur = g; n._fid = id;
  return n;
}
function showText(n, x, y, vis, blurX = 0, blurY = 0) {
  set(n, { x, y, opacity: clamp(vis) });
  if (blurX > 0.05 || blurY > 0.05) { n.setAttribute("filter", `url(#${n._fid})`); n._blur.setAttribute("stdDeviation", `${blurX.toFixed(2)} ${blurY.toFixed(2)}`); }
  else n.removeAttribute("filter");
}

/**
 * Visibility of a piece of content that enters at tIn and exits at tOut
 * (either may be null). Returns {o, dy, blur}: opacity, travel and blur.
 * Exits are short and directional; entries wait for the exit they replace.
 */
function presence(tau, tIn, tOut, { travel = 14, enter = SP.ui, exitDur = 0.13, dirIn = 1, dirOut = -1 } = {}) {
  const w = x => (x < 0 ? x + LOOP : x);
  let o = 1, dy = 0, blur = 0;
  if (tIn !== null && tOut === null && tau < tIn) return { o: 0, dy: dirIn * travel, blur: 7 };
  if (tIn !== null) {
    const e = mod(tau - tIn, LOOP), eo = tOut === null ? Infinity : mod(tau - tOut, LOOP);
    // Before tIn (and after tOut) the content is absent. Work out which event happened last.
    const sinceIn = e, sinceOut = eo;
    if (tOut !== null && sinceOut < sinceIn) {
      const q = smooth(sinceOut / exitDur);
      o = 1 - q; dy = dirOut * travel * q; blur = 7 * q;
      if (sinceOut >= exitDur) { o = 0; }
      return { o, dy, blur };
    }
    const p = spring(sinceIn, enter[0], enter[1]);
    o = clamp(sinceIn / 0.16); dy = dirIn * travel * (1 - p); blur = 7 * clamp(1 - sinceIn / 0.14);
    return { o, dy, blur };
  }
  if (tOut !== null) {
    const eo = mod(tau - tOut, LOOP);
    const q = smooth(eo / exitDur);
    return { o: 1 - q, dy: dirOut * travel * q, blur: 7 * q };
  }
  return { o, dy, blur };
}

// ---------------------------------------------------------------- icons
// One family: 24-unit grid, round caps and joins, drawn at a constant world stroke width.
const ICONS = {
  plus: "M12 5v14M5 12h14",
  close: "M6.5 6.5l11 11M17.5 6.5l-11 11",
  check: "M5 12.6l4.3 4.3L19 7.2",
  lock: "M7.5 11V8.3a4.5 4.5 0 0 1 9 0V11M6.5 11h11a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5v-6A1.5 1.5 0 0 1 6.5 11z",
  web: "M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM3.4 9.5h17.2M3.4 14.5h17.2M12 3c-2.4 2.4-3.6 5.4-3.6 9s1.2 6.6 3.6 9c2.4-2.4 3.6-5.4 3.6-9S14.4 5.4 12 3z",
  files: "M4 7.2A2.2 2.2 0 0 1 6.2 5h3.4l2.2 2.2h6A2.2 2.2 0 0 1 20 9.4v7.4A2.2 2.2 0 0 1 17.8 19H6.2A2.2 2.2 0 0 1 4 16.8z",
  code: "M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.3 5.3l-2.6 13.4",
  browser: "M5.5 4.5h13a2.5 2.5 0 0 1 2.5 2.5v10a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17V7a2.5 2.5 0 0 1 2.5-2.5zM3 9h18M6.3 6.8h.01M8.8 6.8h.01",
  wallet: "M18.5 8.5V6.8A1.8 1.8 0 0 0 16.7 5H6.3A2.3 2.3 0 0 0 4 7.3v9.4A2.3 2.3 0 0 0 6.3 19h11.9a1.8 1.8 0 0 0 1.8-1.8v-6.9a1.8 1.8 0 0 0-1.8-1.8H6.2A2.2 2.2 0 0 1 4 7.3M16.2 13.9h.01",
  search: "M11 4.5a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13zM16 16l4 4",
  doc: "M7.3 3.5h6.4L18.5 8.3v11a1.2 1.2 0 0 1-1.2 1.2H7.3a1.2 1.2 0 0 1-1.2-1.2V4.7a1.2 1.2 0 0 1 1.2-1.2zM13.5 3.6v4.9h4.9M9.2 12.6h6.1M9.2 16h4.2",
  page: "M5.5 4.5h13A2.5 2.5 0 0 1 21 7v10a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17V7a2.5 2.5 0 0 1 2.5-2.5zM3 9.2h18M9.4 9.2v10.3",
  pdf: "M7.3 3.5h6.4L18.5 8.3v11a1.2 1.2 0 0 1-1.2 1.2H7.3a1.2 1.2 0 0 1-1.2-1.2V4.7a1.2 1.2 0 0 1 1.2-1.2zM13.5 3.6v4.9h4.9M9.2 15.2l1.9-2.4 1.7 1.6 2.2-2.9",
  saved: "M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM8.2 12.3l2.6 2.6 5.1-5.2",
  layers: "M12 4l8 4-8 4-8-4 8-4zM4 12l8 4 8-4M4 16l8 4 8-4",
  flag: "M6.5 20.5V4.2M6.5 4.8h10.2l-2.2 3.9 2.2 3.9H6.5",
  more: "M6.5 12h.01M12 12h.01M17.5 12h.01",
};
/** An icon of size px (world), stroke fixed at sw world px. */
function icon(parent, name, color, size = 28, sw = 2.2) {
  const g = el("g", {}, parent);
  const p = el("path", { d: ICONS[name], fill: "none", stroke: color, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  g._size = size;
  // Dots are zero-length strokes with round caps; the "more" dots are drawn heavier to read at small sizes.
  set(p, { "stroke-width": (sw * 24 / size) * (name === "more" ? 1.9 : 1) });
  g._path = p;
  return g;
}
function placeIcon(g, cx, cy, o = 1, s = 1) {
  const k = (g._size / 24) * s;
  set(g, { transform: `translate(${(cx - 12 * k).toFixed(3)} ${(cy - 12 * k).toFixed(3)}) scale(${k.toFixed(5)})`, opacity: clamp(o) });
}

// ---------------------------------------------------------------- faces
// The NATION bot face: a soft-tower head (body + top tab), two eyes, one mouth.
// Proportions from public/bot-faces/*.svg, as fractions of the face width fw.
// Roles differ only by the eyes.
const EYES = {
  chief: { w: 0.2, h: 0.34, r: 0.1 },
  research: { w: 0.24, h: 0.24, r: 0.12 },  // round: it looks things up
  build: { w: 0.22, h: 0.22, r: 0.045 },    // square: it makes things
  review: { w: 0.23, h: 0.12, r: 0.06 },    // narrowed: it checks things
};
function faceParts(fx, fy, fw, kind) {
  const E = EYES[kind];
  const ecx = [fx + 0.3 * fw, fx + 0.7 * fw], ecy = fy + 0.47 * fw; // eye centres (from the source art)
  const eyes = ecx.map(cx => [cx - (E.w * fw) / 2, ecy - (E.h * fw) / 2, E.w * fw, E.h * fw, E.r * fw]);
  const mouth = [fx + 0.24 * fw, fy + 0.7 * fw, 0.52 * fw, 0.16 * fw, 0.08 * fw];
  return { eyes, mouth };
}
function tabRect(bodyTop, fx, fw) { return [fx + 0.28 * fw, bodyTop - 0.16 * fw, 0.44 * fw, 0.24 * fw, 0.12 * fw]; }

/** Blend two role eye shapes (for the moment roles are assigned). */
function eyeBlend(a, b, u) {
  const A = EYES[a], Bq = EYES[b];
  return { w: lerp(A.w, Bq.w, u), h: lerp(A.h, Bq.h, u), r: lerp(A.r, Bq.r, u) };
}

/** Draws a face: eyes + mouth rects in a group. */
class Face {
  constructor(parent, color) {
    this.g = el("g", {}, parent);
    this.eyes = [el("rect", { fill: color }, this.g), el("rect", { fill: color }, this.g)];
    this.mouth = el("rect", { fill: color }, this.g);
  }
  /**
   * fx, fy, fw: face zone. eye: {w,h,r} fractions. look: [dx, dy] as fraction of fw.
   * blink: 0..1 squash. grow: 0..1 scale about the zone centre.
   */
  draw(fx, fy, fw, eye, { look = [0, 0], blink = 0, grow = 1, o = 1, color } = {}) {
    const g = clamp(grow, 0, 1.2);
    const zc = [fx + fw / 2, fy + 0.55 * fw];
    const S = (x, y) => [zc[0] + (x - zc[0]) * g, zc[1] + (y - zc[1]) * g];
    const ecy = fy + 0.47 * fw + look[1] * fw;
    [0.3, 0.7].forEach((ex, i) => {
      const cx = fx + ex * fw + look[0] * fw;
      const w = eye.w * fw, h = Math.max(eye.h * fw * (1 - 0.86 * blink), 0.02 * fw);
      const [x, y] = S(cx - w / 2, ecy - h / 2);
      rr(this.eyes[i], x, y, w * g, h * g, Math.min(eye.r * fw, (h * g) / 2) * g);
    });
    const [mx, my] = S(fx + 0.24 * fw + look[0] * fw * 0.5, fy + 0.7 * fw + look[1] * fw * 0.5);
    rr(this.mouth, mx, my, 0.52 * fw * g, 0.16 * fw * g, 0.08 * fw * g);
    set(this.g, { opacity: clamp(o) });
    if (color) for (const n of [...this.eyes, this.mouth]) n.setAttribute("fill", color);
  }
}

// ---------------------------------------------------------------- scene geometry
// World units are pixels at camera scale 1. The loop starts and ends on the

const CHIP_FACE = { fx: -CHIP_W / 2, fy: -0.49 * CHIP_W, fw: CHIP_W };

// Camera: the world point at the centre of the frame, and scale.
const cam = { x: T(0, "cam.x"), y: T(-12, "cam.y"), s: T(1.36, "cam.s") };
function camTo(t, x, y, s, p = SP.cam) { cam.x.to(t, x, p); cam.y.to(t, y, p); cam.s.to(t, s, p); }

class CursorPath {
  constructor(x, y) { this.p0 = [x, y]; this.p = [x, y]; this.moves = []; }

function drawChief(tau, p) {

  rr(cBody, s.l, s.t, s.w, s.h, s.rad);
  // Tab: tucks into the body while the column is up, rises again as the top bars fold into it.
  const ts = clamp(tabShow.at(tau), 0, 1.2);
  const tab = tabRect(s.t, fx, fw);
  rr(cTab, tab[0], s.t - (s.t - tab[1]) * ts, tab[2], Math.max(0, tab[3] * ts), tab[4]);
  const fold = clamp(abFold.at(tau), 0, 1.05);
  const tabFull = tabRect(s.t, fx, fw);
  [[cAbA, COL.abacusTop], [cAbB, COL.abacusBottom]].forEach(([n, a]) => {
    const r = lerpRect(a, tabFull, fold);
    rr(n, ...r);
    set(n, { opacity: tau > b(31) && tau < b(32) + 0.4 ? 1 - smooth(clamp(fold * 1.25)) : 0 });
  });
  // Face: eyes and mouth, or the three shafts.
  const face = faceParts(fx, fy, fw, "chief");
  const blink = bump(clamp((tau - 0.1) / 0.16)) + bump(clamp((tau - b(9) - 0.2) / 0.16));
  const look = [0, 0];
  if (tau > b(7) - 0.1 && tau < b(9) + 0.2) { const k = clamp((tau - b(7) + 0.1) / 0.3) * clamp((b(9) + 0.2 - tau) / 0.2); look[1] = 0.05 * k; }
  // draw face normally, then blend each part toward its shaft
  cFace.draw(fx, fy, fw, EYES.chief, { blink: Math.min(1, blink), look, o: clamp(faceO.at(tau)) });
  const parts = [[cFace.eyes[0], FM.eyes], [cFace.eyes[1], FM.eyes], [cFace.mouth, FM.mouth]];
  parts.forEach(([n, m], i) => {
    const ml = m.l.at(tau), mt = m.t.at(tau), mr = m.r.at(tau), mb = m.b.at(tau);
    if (Math.max(Math.abs(ml), Math.abs(mt), Math.abs(mr), Math.abs(mb)) < 1e-5) return;

  const A = COL.arch, ar = A.R * cu, ir = A.r * cu;

  showText(cRoleB, tx, s.t + 120 + rb.dy, rb.o, 0, rb.blur);

function drawPods(tau, p) {
  const vis = podVisible(tau);

    const face = i === 1 ? buildFace(s, tau) : { fx: s.cx - 64, fy: s.t + 20, fw: 128 };
    shell(n.body, n.tab, s, face, i === 1 ? 1 : clamp(podGrow[i].at(tau) * 1.5));
    const grow = clamp(podGrow[i].at(tau), 0, 1.1);
    const eye = eyeBlend("chief", role, rm);
    let look = [0, 0];
    if (i === 0 && tau > b(10) - 0.15 && tau < b(11) + 0.1) look = [0.04, -0.05 * clamp((b(10) + 0.1 - tau) / 0.2)];
    if (i === 1 && tau > b(11) - 0.15 && tau < b(12)) look = [-0.05 * clamp((b(11) + 0.1 - tau) / 0.25), 0];
    if (tau > b(7) - 0.1 && tau < b(9) + 0.1) look = [0, 0.06 * clamp((tau - b(7) + 0.1) / 0.3)];
    if (tau > b(27) + 0.3 && tau < b(29)) look = [[-0.04, 0.05], [0, 0.07], [0.03, 0.05]][i];
    const blink = bump(clamp((tau - b(6) - 0.36 - i * 0.07) / 0.16)) + (i === 1 ? bump(clamp((tau - b(26) - 0.2) / 0.16)) : 0);
    n.face.draw(face.fx, face.fy, face.fw, eye, { grow, look, blink: Math.min(1, blink) });

}

function drawTask(tau, p) {
  const rise = taskRise.at(tau);
  const gone = clamp(taskGone.at(tau));
  const oth = clamp(others.at(tau));
  let cx, cy, w, h;
  const rest = [(TASK_REST[0] + TASK_REST[2]) / 2, (TASK_REST[1] + TASK_REST[3]) / 2];
  const slot = [(TASK_SLOT[0] + TASK_SLOT[2]) / 2, (TASK_SLOT[1] + TASK_SLOT[3]) / 2];
  const grabP = cur.at(GRAB), off = [rest[0] - grabP[0], rest[1] - grabP[1]];
  const W0 = 452, H0 = 104, W1 = TASK_SLOT[2] - TASK_SLOT[0], H1 = TASK_SLOT[3] - TASK_SLOT[1];
  let lift = 0;
  if (tau < GRAB || tau > b(31)) {
    cx = rest[0]; cy = rest[1] + (1 - rise) * 420; w = W0; h = H0;
  } else if (tau < DROP) {
    const c = cur.at(tau); cx = c[0] + off[0]; cy = c[1] + off[1]; w = W0; h = H0;
    lift = clamp((tau - GRAB) / 0.08);
  } else {

    const c = cur.at(DROP), v = cur.vel(DROP), x = tau - DROP;
    cx = springFrom(x, c[0] + off[0], v[0], slot[0], 0.4, 0.8);
    cy = springFrom(x, c[1] + off[1], v[1], slot[1], 0.4, 0.8) + chiefDip.at(tau) * 0.7;
    const u = spring(x, 0.34, 0.86);
    w = lerp(W0, W1, u); h = lerp(H0, H1, u);
    lift = 1 - clamp(x / 0.12);
  }

  w *= sc; h *= sc;
  rr(taskCard, cx - w / 2, cy - h / 2, w, h, h / 2 * 0.62 + 6);
  const k = h / H0;
  // Content scales with the card; the flag becomes a check when the work is delivered.
  const done = clamp(taskDone.at(tau));
  set(taskIn, { transform: `translate(${cx} ${cy}) scale(${k.toFixed(4)})` });
  placeIcon(taskFlag, -W0 / 2 + 50, 0, 1 - done, 1 - 0.4 * done);
  placeIcon(taskCheck, -W0 / 2 + 50, 0, done, 0.6 + 0.4 * done);
  set(taskText, { x: -W0 / 2 + 86, y: 12 });
  const vis = tau > b(7) - 0.12 && tau < b(31);
  const csc = othersScale.at(tau), ch = chief.at(tau);
  set(taskG, { opacity: vis ? clamp(oth) * (1 - gone) : 0, transform: Math.abs(csc - 1) < 1e-4 ? "" : `translate(${ch.cx} ${ch.cy}) scale(${csc.toFixed(4)}) translate(${-ch.cx} ${-ch.cy})` });
  // Slip: a small copy of the task that is handed down the line.
  const on = clamp(slipOn.at(tau));
  const hx = slipHead[0].at(tau), hy = slipHead[1].at(tau), tx = slipTail[0].at(tau), ty = slipTail[1].at(tau);
  const sw = 100, sh = 34;
  const l = Math.min(hx, tx) - sw / 2, t = Math.min(hy, ty) - sh / 2, r = Math.max(hx, tx) + sw / 2, bm = Math.max(hy, ty) + sh / 2;
  const sh2 = on;
  rr(slipR, lerp((l + r) / 2, l, sh2), lerp((t + bm) / 2, t, sh2), (r - l) * sh2, (bm - t) * sh2, 18);
  placeIcon(slipIc, (hx + tx) / 2, (hy + ty) / 2, clamp(on * 2 - 1));
  set(slipG, { opacity: on > 0.01 ? 1 : 0 });
}

function drawBuildInside(tau, p) {
  const s = podShellRect(1, tau);
  rr(bClipR, s.l, s.t, s.w, s.h, s.rad);
  const pcW = clamp(bw.pc.at(tau)), stW = clamp(bw.strip.at(tau)), cdW = clamp(bw.card.at(tau));
  // --- PC top bar
  const lab = presence(tau, b(12) + 0.36, b(20), { travel: 8 });
  placeIcon(pcLock, s.l + 118, s.t + 45, lab.o);
  showText(pcLabel, s.l + 140, s.t + 55 + lab.dy, lab.o, 0, lab.blur);
  dockN.forEach((d, i) => {
    const o = presence(tau, b(12) + 0.42 + i * 0.05, b(20) + (d.k === "more" ? 0.0 : 0.06), { travel: 8 }).o;
    const [dx, dy] = DOCK[d.k];
    const cx = s.r - (PC[2] - dx), cy = s.t + PC_BAR / 2;
    const hv = hover(p, cx, cy, 28, 28);
    const pk = 1 - 0.08 * pressAt(tau, { browser: b(14), code: b(16), more: b(20) }[d.k]);
    const active = d.k === "browser" ? clamp((tau - b(14)) / 0.1) * clamp((b(16) - tau) / 0.1) : d.k === "code" ? clamp((tau - b(16)) / 0.1) * clamp((b(20) - tau) / 0.1) : 0;
    rr(d.bg, cx - 28 * pk, cy - 28 * pk, 56 * pk, 56 * pk, 17);
    set(d.bg, { "fill-opacity": 0.09 + 0.08 * hv + 0.12 * active });
    placeIcon(d.ic, cx, cy, 1, pk);
    set(d.g, { opacity: o });
  });
  // --- Screen: lights up at beat 13, folds away at beat 20.
  const so = clamp(screenOn.at(tau), 0, 1.02);
  const sx = s.l + 16, sy = s.t + PC_BAR, sw = s.w - 32, shFull = s.h - PC_BAR - 16;
  const sh = Math.max(0, shFull * clamp(so));
  rr(screen, sx, sy, sw, sh, 26);
  set(screen, { opacity: clamp(so * 3) });
  rr(clipR, sx, sy, sw, sh, 26);
  set(scr, { opacity: clamp(so * 3) });
  // Browser: address bar and query, typed by the agent.
  const ax = sx + 22, ay = sy + 22, aw = sw - 44, ah = addrH.at(tau);
  const addrIn = tau > b(14) && tau < b(20) + 0.3 ? presence(tau, b(14) + 0.02, null).o : 0;
  rr(addr, ax, ay, aw, ah, ah / 2);
  set(addr, { opacity: addrIn });
  const toCode = clamp((addrH.v0 - ah) / 16);
  const nq = Math.floor(clamp((tau - b(14) - 0.1) / 0.36) * QUERY.length);
  addrText.textContent = QUERY.slice(0, tau > b(14) ? nq : 0);
  set(addrText, { x: ax + 58, y: ay + ah / 2 + 9, opacity: addrIn * (1 - toCode) });
  placeIcon(addrIc, ax + 30, ay + ah / 2, addrIn * (1 - toCode));
  const qw = measure("q" + nq, addrText, QUERY.slice(0, nq));
  rr(addrCaret, ax + 60 + qw, ay + ah / 2 - 14, 2.5, 28, 1);
  set(addrCaret, { opacity: addrIn * (1 - toCode) * (tau > b(14) + 0.08 && tau < b(15) + 0.2 && Math.sin((tau - b(14)) * TAU * 3) > -0.3 ? 1 : 0) });
  const tb = presence(tau, b(16) + 0.1, b(20) - 0.02, { travel: 6 });
  showText(tabText, ax + 26, ay + ah / 2 + 7 + tb.dy, tb.o, 0, tb.blur);
  // Results land at beat 15; one line is highlighted; they leave when the page becomes code.
  results.forEach((r, i) => {
    const pr = presence(tau, b(15) + i * 0.06, b(16) + 0.02, { travel: 16, dirOut: -1 });
    const y = ay + 110 + i * 116 + pr.dy;
    showText(r.h, ax + 8, y, pr.o, 0, pr.blur);
    showText(r.s, ax + 8, y + 38, pr.o, 0, pr.blur);
    const hw = i === 0 ? measure("res0", r.s, RESULTS[0][1]) * clamp(hiSweep.at(tau)) : 0;
    rr(r.hi, ax + 2, y + 38 - 24, hw + 12, 33, 6);
    set(r.hi, { opacity: pr.o });
  });
  // Code workspace.
  const cIn = b(16) + 0.18;
  const fl = presence(tau, cIn, b(20) - 0.02, { travel: 10 });
  fileN.forEach((n, i) => showText(n, ax + 18, ay + ah + 50 + i * 44 + fl.dy, presence(tau, cIn + i * 0.03, b(20) - 0.02, { travel: 10 }).o, 0, fl.blur));
  rr(fileSel, ax + 4, ay + ah + 50 + 44 - 29, 216, 40, 10);
  set(fileSel, { opacity: fl.o });
  const ex = ax + 290, numX = ax + 268, ly0 = ay + ah + 58, LH = 46;
  const dOpen = clamp(diffOpen.at(tau), 0, 1.05);
  const ne = Math.floor(clamp((tau - b(17) - 0.16) / 0.26) * NEW.length);
  const selW = measure("sel", editText, "Coming soon");
  const prefixW = measure("pre", editText, "  <h1>");
  CODE.forEach(([str, edit], i) => {
    const pr = presence(tau, cIn + 0.04 + i * 0.035, b(20) - 0.02, { travel: 10 });
    const y = ly0 + i * LH + (i >= 1 ? dOpen * LH : 0) + pr.dy;
    showText(codeN[i].num, numX, y, pr.o * 0.9 * (edit ? 1 - clamp(dOpen * 3) : 1), 0, pr.blur);
    codeN[i].num.textContent = String(i + 1);
    if (edit) {
      codeN[i].txt.textContent = "  <h1>";
      showText(codeN[i].txt, ex, y, pr.o, 0, pr.blur);
      // Select "Coming soon", then type the new headline over it.
      const selecting = tau > b(17) - 0.02 && tau < b(17) + 0.16;
      const typedNew = tau >= b(17) + 0.16 && tau < b(20) + 0.3;
      const body = typedNew ? NEW.slice(0, ne) : OLD;
      editText.textContent = body;
      const bw2 = typedNew ? measure("new" + ne, editText, NEW.slice(0, ne)) : selW;
      set(editText, { x: ex + prefixW, y, opacity: pr.o });
      editTail.textContent = "</h1>";
      set(editTail, { x: ex + prefixW + bw2, y, opacity: pr.o });
      rr(editSel, ex + prefixW - 2, y - 24, selW + 4, 32, 5);
      set(editSel, { opacity: selecting ? pr.o * clamp((tau - b(17) + 0.02) / 0.05) : 0 });
      rr(editCaret, ex + prefixW + bw2 + 1, y - 22, 2.5, 28, 1);
      set(editCaret, { opacity: typedNew && tau < b(18) + 0.1 && Math.sin((tau - b(17)) * TAU * 3) > -0.4 ? pr.o : 0 });
      // Diff: the old line stays above, struck; the new one gets a mark and a band.
      showText(oldLine, ex, ly0 + LH + pr.dy, pr.o * clamp(dOpen), 0, 0);
      const ow = measure("old", oldLine, "  <h1>Coming soon</h1>");
      rr(oldStrike, ex + prefixW * 0.95, ly0 + LH - 8 + pr.dy, (ow - prefixW) * clamp(dOpen * 1.3), 2, 1);
      set(oldStrike, { opacity: pr.o * clamp(dOpen) });
      showText(oldMark, numX - 12, ly0 + LH + pr.dy, pr.o * clamp(dOpen), 0, 0);
      showText(newMark, numX - 12, y, pr.o * clamp(dOpen), 0, 0);
      rr(newBg, ex - 30, y - 30, ax + aw - 16 - (ex - 30), 42, 8);
      set(newBg, { opacity: pr.o * clamp(dOpen) });
      // Review approves, beat 19.
      const rv = presence(tau, b(19), b(20) - 0.02, { travel: 0 });
      const slide = (1 - spring(tau - b(19), 0.34, 0.82)) * 70;
      const rwid = 172, rx = ax + aw - 16 - rwid - 6 + slide, ry = y - 8;
      rr(reviewBg, rx, ry - 23, rwid, 46, 23);
      reviewFace.draw(rx + 8, ry - 23 + 1, 40, EYES.review, { o: 1 });
      set(reviewTxt, { x: rx + 52, y: ry + 7.5 });
      placeIcon(reviewCk, rx + rwid - 25, ry, 1, 0.5 + 0.5 * spring(tau - b(19) - 0.08, 0.3, 0.7));
      set(reviewG, { opacity: rv.o * (tau > b(19) - 0.01 ? 1 : 0) });
    } else {
      showText(codeN[i].txt, ex, y, pr.o, 0, pr.blur);
    }
  });
  // --- Tool strip, beat 20.
  toolN.forEach((tn, i) => {
    const pr = presence(tau, b(20) + 0.12 + i * 0.035, b(21) - 0.01 + (tn.k === "wallet" ? 0.03 : 0), { travel: 12 });
    const cx = s.r - (STRIP[2] - toolX(i)), cy = s.cy;
    const hv = hover(p, cx, cy, 58, 56);
    const pk = 1 - 0.07 * pressAt(tau, tn.k === "wallet" ? b(21) : -9);
    rr(tn.bg, cx - 58 * pk, cy - 56 * pk + pr.dy, 116 * pk, 112 * pk, 24);
    set(tn.bg, { "fill-opacity": 0.08 + 0.1 * hv });
    placeIcon(tn.ic, cx, cy - 14 + pr.dy, 1, pk);
    showText(tn.lb, cx, cy + 36 + pr.dy, 1, 0, 0);
    set(tn.g, { opacity: pr.o });
  });
  // --- Wallet, beats 21-23.
  const wv = presence(tau, b(21) + 0.14, b(23), { travel: 12 });
  placeIcon(wIc, s.l + 160, s.t + 72 + wv.dy, wv.o);
  showText(wTitle, s.l + 190, s.t + 84 + wv.dy, wv.o, 0, wv.blur);
  showText(wAddr, s.l + 36, s.t + 196 + wv.dy, presence(tau, b(21) + 0.2, b(23), { travel: 12 }).o, 0, wv.blur);
  const rd = clamp(ready.at(tau), 0, 1.3);
  const rdv = presence(tau, b(21) + 0.24, b(23), { travel: 12 });
  set(wDot, { cx: s.l + 48, cy: s.t + 262 + rdv.dy, r: 8 + 1.5 * clamp(rd - 1, 0, 0.3), fill: mixColor("#3A4239", GREEN, clamp(rd)), opacity: rdv.o });
  set(wHalo, { cx: s.l + 48, cy: s.t + 262 + rdv.dy, r: 8 + 14 * clamp(rd), opacity: rdv.o * 0.16 * clamp(rd) * (1 - clamp((tau - b(22) - 0.25) / 0.4)) });
  showText(wReady, s.l + 72, s.t + 272 + rdv.dy, rdv.o * (0.35 + 0.65 * clamp(rd)), 0, rdv.blur);
  // --- Memory, beats 23-27 (closed at 25, reopened at 26: the same rows, in the same places).
  const mv = presence(tau, b(23) + 0.16, b(25), { travel: 12 });
  const mv2 = presence(tau, b(26) + 0.16, b(27), { travel: 0, enter: [0.3, 1] });
  const mO = Math.max(mv.o * (tau < b(26) ? 1 : 0), mv2.o * (tau >= b(26) ? 1 : 0));
  const mDy = tau < b(26) ? mv.dy : 0, mBl = tau < b(26) ? mv.blur : mv2.blur;
  showText(mTitle, s.l + 136, s.t + 84 + mDy, mO, 0, mBl);
  const hvC = hover(p, s.r - 48, s.t + 58, 26, 26), pkC = 1 - 0.1 * pressAt(tau, b(25));
  rr(mCloseBg, s.r - 48 - 26 * pkC, s.t + 58 - 26 * pkC, 52 * pkC, 52 * pkC, 16);
  set(mCloseBg, { "fill-opacity": 0.09 + 0.1 * hvC });
  placeIcon(mCloseIc, s.r - 48, s.t + 58, 1, pkC);
  set(mClose, { opacity: mO });
  memN.forEach((m, i) => {
    const slot = presence(tau, b(23) + 0.2 + i * 0.05, b(25), { travel: 0, enter: [0.3, 1] });
    const first = presence(tau, b(24) + i * 0.09, b(25), { travel: 16 });
    const slotO = tau < b(26) ? slot.o : mv2.o;
    const o = tau < b(26) ? first.o : mv2.o, dy = tau < b(26) ? first.dy : 0, bl = tau < b(26) ? first.blur : mv2.blur;
    const y = s.t + 140 + i * 100;
    rr(m.bg, s.l + 26, y, s.w - 52, 84, 22);
    set(m.bg, { opacity: slotO });
    placeIcon(m.ic, s.l + 64, y + 42 + dy, o);
    showText(m.t, s.l + 98, y + 52 + dy, o, 0, bl);
    set(m.g, { opacity: 1 });
  });
}

function drawDeliverable(tau) {
  const oth = clamp(others.at(tau));
  const gone = clamp(rowsGone.at(tau));
  rowN.forEach((r, i) => {
    const u = rowFly[i].at(tau);
    const f = FILES[i];
    const from = podRect(f.from);
    const src = [from[0] + 60, 300, from[2] - 60, 360, 18];
    const dst = ROW(i);
    // leading edge first: the top rises, the sides widen a moment later
    const ut = clamp(u, 0, 1.08), us = clamp(spring(tau - b(29) - 0.04 - (2 - i) * 0.03, 0.36, 0.86), 0, 1.05);
    const l = lerp(src[0], dst[0], us), rgt = lerp(src[2], dst[2], us);
    const t = lerp(src[1], dst[1], ut), bm = lerp(src[3], dst[3], clamp(u * 0.92 + 0.08 * us, 0, 1.08));
    let o = clamp(u * 4) * (tau > b(29) - 0.05 && tau < b(31) ? 1 : 0);
    // The landing-page row becomes the page; the others step away.
    if (i !== 1) o *= 1 - gone;
    if (i === 1) o *= 1 - clamp((tau - b(30)) / 0.12);
    rr(r.bg, l, t, rgt - l, bm - t, 20);
    placeIcon(r.ic, l + 40, (t + bm) / 2, 1);
    set(r.t, { x: l + 74, y: (t + bm) / 2 + 9 });
    set(r.g, { opacity: o * oth });
  });
}

function drawPage(tau) {
  const vis = tau > b(30) - 0.02 && tau < COL_SWITCH;
  set(pgG, { opacity: vis ? 1 : 0 });
  if (!vis) return;
  const a = clamp(pageOpen.at(tau), 0, 1.06), c = clamp(colMorph.at(tau), 0, 1.04);
  // Beat 30: the landing-page row opens into the page, top edge first. Beat 31: the page closes onto the tile.
  const at = clamp(pageTop.at(tau), 0, 1.06), ab = clamp(pageBottom.at(tau), 0, 1.06);
  const row = ROW(1);
  const open = [lerp(row[0], PAGE[0], a), lerp(row[1], PAGE[1], at), lerp(row[2], PAGE[2], a), lerp(row[3], PAGE[3], ab), lerp(row[4], PAGE[4], a)];
  const pr = lerpRect(open, TILE, c);
  rr(pgBg, pr[0], pr[1], pr[2] - pr[0], pr[3] - pr[1], pr[4]);
  rr(pgClipR, pr[0], pr[1], pr[2] - pr[0], pr[3] - pr[1], pr[4]);
  pgBg.setAttribute("fill", mixColor(WHITE, INK, smooth(clamp(c * 1.15))));
  set(pgSh1, { "flood-opacity": 0.1 * (1 - clamp(c)) }); set(pgSh2, { "flood-opacity": 0.1 * (1 - clamp(c)) });
  // Page-local -> world, for the page as it is now.
  const k = (open[2] - open[0]) / 920, ox = open[0], oy = open[1] + (open[3] - open[1] - 664 * k) / 2 * (1 - clamp(a));
  const W = ([x, y, w, h, r]) => [ox + x * k, oy + y * k, w * k, h * k, r * k];
  // Words and buttons leave just before the page closes.
  const cin = presence(tau, b(30) + 0.14, b(31) - 0.04, { travel: 14, exitDur: 0.11 });
  set(pgIn, { opacity: cin.o, transform: `translate(${ox} ${oy + cin.dy}) scale(${k.toFixed(4)})` });
  if (cin.blur > 0.05) { pgIn.setAttribute("filter", "url(#pg-blur)"); pgBlur.setAttribute("stdDeviation", `0 ${cin.blur.toFixed(2)}`); } else pgIn.removeAttribute("filter");
  // Light parts become the column: the nav bar parts into the two top bars, the three features become the shafts.
  const green = mixColor(CANVAS, GREEN, smooth(clamp(c * 1.2)));
  [COL.abacusTop, COL.abacusBottom].forEach((ab, i) => {
    const r = lerpRect(W(NAV), ab, c);
    rr(pgNav[i], ...r);
    set(pgNav[i], { fill: green, opacity: clamp(a * 2 - 0.6) });
  });
  FEAT.forEach((f, i) => {
    const r = lerpRect(W(FEAT_R(i)), COL.shafts[[0, 2, 1][i]], c);
    rr(featBg[i], ...r);
    set(featBg[i], { fill: green, opacity: clamp(a * 2 - 0.6) });
  });
}
const pgBlurF = el("filter", { id: "pg-blur", x: "-10%", y: "-30%", width: "120%", height: "160%" }, defs);
const pgClip = el("clipPath", { id: "page-clip" }, defs);
const pgClipR = el("rect", {}, pgClip);
set(pgInClip, { "clip-path": "url(#page-clip)" });
pgNav.forEach(n => set(n, { "clip-path": "url(#page-clip)" }));
featBg.forEach(n => set(n, { "clip-path": "url(#page-clip)" }));
const pgBlur = el("feGaussianBlur", { stdDeviation: "0 0" }, pgBlurF);

function drawCursor(tau, camx, camy, cams) {
  const [wx, wy] = cur.at(tau);
  const sx = 720 + (wx - camx) * cams, sy = 720 + (wy - camy) * cams;
  const pr = pressing(tau);
  const k = 2.05 * (1 - 0.12 * pr);
  set(curG, { transform: `translate(${(sx - 5.2 * k).toFixed(2)} ${(sy - 2.8 * k).toFixed(2)}) scale(${k.toFixed(4)})` });
  return [wx, wy];
}

// ---------------------------------------------------------------- seek
function seek(t) {
  const tau = mod(t, LOOP);
  const cx = cam.x.at(tau), cy = cam.y.at(tau), cs = cam.s.at(tau);
  world.setAttribute("transform", `translate(720 720) scale(${cs.toFixed(5)}) translate(${(-cx).toFixed(3)} ${(-cy).toFixed(3)})`);
  const p = drawCursor(tau, cx, cy, cs);
  drawPods(tau, p);
  drawChief(tau, p);
  drawTask(tau, p);
  drawBuildInside(tau, p);
  drawWork(tau);
  drawDeliverable(tau);
  drawPage(tau);
}

// ---------------------------------------------------------------- sound cues
// UI sounds are placed from the same beat constants as the picture (tools/sfx.py reads this list).
const typing = (t0, dur, n, keys) => Array.from({ length: keys }, (_, i) => ({ t: t0 + (dur * (i + 0.5)) / keys, k: "key", v: 0.55 + 0.45 * ((i * 7) % 5) / 4 }));
const SOUNDS = [
  ...CLICKS.map(t => ({ t, k: "click" })),
  { t: GRAB, k: "grab" },
  { t: DROP + 0.03, k: "drop" },
  { t: b(5) + 0.02, k: "spawn" },
  { t: b(6) + 0.05, k: "split" },
  { t: b(10), k: "handoff", pan: -0.3 }, { t: b(10) + 0.13, k: "catch", pan: -0.35 },
  { t: b(11), k: "handoff", pan: 0 }, { t: b(11) + 0.11, k: "catch", pan: 0 },
  { t: b(13) - 0.04, k: "pcOn" },
  ...typing(b(14) + 0.1, 0.36, QUERY.length, 10),
  ...typing(b(17) + 0.16, 0.26, NEW.length, 6),
  { t: b(19) + 0.02, k: "approve" },
  { t: b(22), k: "ready" },
  { t: b(24), k: "mem", n: 0 }, { t: b(24) + 0.09, k: "mem", n: 1 }, { t: b(24) + 0.18, k: "mem", n: 2 },
  { t: b(25) + 0.02, k: "fold" },
  { t: b(26) + 0.02, k: "unfold" },
  { t: b(29) + 0.14, k: "deliver" },
].map(e => ({ ...e, t: mod(e.t, LOOP) }));
window.SOUNDS = SOUNDS;

checkTracks();
if (Math.hypot(cur.p[0] - cur.p0[0], cur.p[1] - cur.p0[1]) > 1e-6) throw new Error("cursor does not return to its start");

window.LOOP = LOOP;
window.GRID = GRID;
window.seek = seek;
window.ready = document.fonts.ready.then(() => { seek(0); return true; });

// Live preview (not used for rendering). Each frame asks a clock for the time and draws
// seek(t), nothing else. Click to hear it: the audio clock then drives the picture.
const AUDIO = "/*AUDIO*/";
if (!/[?&]render\b/.test(location.search)) {
  document.body.classList.add("preview");
  const q = new URLSearchParams(location.search);
  const fixed = q.has("t") ? parseFloat(q.get("t")) : null;
  const t0 = performance.now();
  let clock = () => (performance.now() - t0) / 1000;
  const hint = document.createElement("div");
  hint.textContent = "Click for sound";
  hint.style.cssText = "position:fixed;left:16px;bottom:14px;font:500 13px Geist,sans-serif;color:#020C01;opacity:.5;pointer-events:none";
  if (AUDIO.startsWith("data:") && fixed === null) document.body.appendChild(hint);
  addEventListener("pointerdown", async () => {
    if (!AUDIO.startsWith("data:") || clock.audio) return;
    const ctx = new AudioContext();
    const buf = await ctx.decodeAudioData(await (await fetch(AUDIO)).arrayBuffer());
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true; src.loopStart = 0; src.loopEnd = Math.min(LOOP, buf.duration);
    src.connect(ctx.destination);
    const start = ctx.currentTime + 0.05;
    const offset = mod(clock(), LOOP);
    src.start(start, offset);
    clock = Object.assign(() => offset + Math.max(0, ctx.currentTime - start), { audio: true });
    hint.remove();
  });
  window.ready.then(() => {
    if (fixed !== null) { seek(fixed); return; }
    const frame = () => { seek(mod(clock(), LOOP)); requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
  });
}
